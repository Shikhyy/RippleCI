name: RippleCI Release Intelligence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  ripple-intelligence:
    name: Blast Radius & Regression Analysis
    runs-on: ubuntu-latest

    services:
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ripple Doctor
        run: |
          ripple doctor

      - name: Index Repository into FalkorDB
        run: |
          ripple index

      - name: Analyze Change Blast Radius
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
          echo "Analyzing range: $RANGE"
          ripple impact "$RANGE" --format json > ripple-impact.json
          ripple impact "$RANGE"

      - name: Plan Budgeted Regression Tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
          ripple plan --range "$RANGE" --budget 300 --format json > ripple-plan.json
          ripple plan --range "$RANGE" --budget 300

      - name: Execute Verification & Bounded Mutation
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
          ripple verify --range "$RANGE" --mutations 5

      - name: Generate Release Intelligence Summary
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
          ripple report --range "$RANGE" --format markdown >> $GITHUB_STEP_SUMMARY

      - name: Upload Analysis Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rippleci-analysis-artifacts
          path: |
            ripple-impact.json
            ripple-plan.json
          retention-days: 14
