<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121A2B" />
      <stop offset="100%" stop-color="#0B0D10" />
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAD48E" />
      <stop offset="100%" stop-color="#E5A952" />
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5A952" stop-opacity="0.65" />
      <stop offset="60%" stop-color="#1B3B3F" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0B0D10" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base with Border -->
  <rect width="32" height="32" rx="7" fill="url(#bg)" stroke="#1B3B3F" stroke-width="1" />

  <!-- Radiating Ripple Waves -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#1B3B3F" stroke-width="0.9" stroke-dasharray="2 2" stroke-opacity="0.8" />
  <circle cx="16" cy="16" r="8" fill="none" stroke="#E5A952" stroke-width="1.1" stroke-opacity="0.65" />
  <circle cx="16" cy="16" r="5" fill="url(#pulse)" />

  <!-- Graph Dependency Edges -->
  <line x1="16" y1="16" x2="22" y2="11" stroke="#8B5E3C" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.9" />
  <line x1="16" y1="16" x2="10" y2="21" stroke="#5B4A5F" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.9" />
  <line x1="16" y1="16" x2="21" y2="21" stroke="#2E4A32" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.9" />

  <!-- Peripheral Graph Nodes (Semantic: Modified, Impacted, Test) -->
  <circle cx="22" cy="11" r="2.2" fill="#8B5E3C" stroke="#0B0D10" stroke-width="0.8" />
  <circle cx="10" cy="21" r="2.0" fill="#5B4A5F" stroke="#0B0D10" stroke-width="0.8" />
  <circle cx="21" cy="21" r="2.0" fill="#2E4A32" stroke="#0B0D10" stroke-width="0.8" />

  <!-- Core Origin Node (Moon Stone & Olive Glow) -->
  <circle cx="16" cy="16" r="3.2" fill="url(#amber-glow)" />
  <circle cx="16" cy="16" r="1.5" fill="#C9C4B8" />
</svg>
