<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base with Border -->
  <rect width="32" height="32" rx="7" fill="url(#bg)" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />

  <!-- Radiating Ripple Waves -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#FFFFFF" stroke-width="0.8" stroke-dasharray="2 2" stroke-opacity="0.4" />
  <circle cx="16" cy="16" r="8" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-opacity="0.75" />
  <circle cx="16" cy="16" r="5" fill="url(#pulse)" />

  <!-- Graph Dependency Edges -->
  <line x1="16" y1="16" x2="22" y2="11" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.85" />
  <line x1="16" y1="16" x2="10" y2="21" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.7" />
  <line x1="16" y1="16" x2="21" y2="21" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.7" />

  <!-- Peripheral Graph Nodes -->
  <circle cx="22" cy="11" r="2.2" fill="#FFFFFF" stroke="#000000" stroke-width="0.8" />
  <circle cx="10" cy="21" r="2.0" fill="#A3A3A3" stroke="#000000" stroke-width="0.8" />
  <circle cx="21" cy="21" r="2.0" fill="#737373" stroke="#000000" stroke-width="0.8" />

  <!-- Core Origin Node (Luminous Pure White) -->
  <circle cx="16" cy="16" r="3.2" fill="#FFFFFF" />
  <circle cx="16" cy="16" r="1.5" fill="#000000" />
</svg>
