<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1014" />
      <stop offset="100%" stop-color="#040709" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6CC6CB" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6CC6CB" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#0ea5e9" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base with Border -->
  <rect width="32" height="32" rx="7" fill="url(#bg)" stroke="#1e293b" stroke-width="1" />

  <!-- Radiating Ripple Waves -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#6CC6CB" stroke-width="0.8" stroke-dasharray="2 2" stroke-opacity="0.35" />
  <circle cx="16" cy="16" r="8" fill="none" stroke="#38bdf8" stroke-width="1.1" stroke-opacity="0.6" />
  <circle cx="16" cy="16" r="5" fill="url(#pulse)" />

  <!-- Graph Dependency Edges -->
  <line x1="16" y1="16" x2="22" y2="11" stroke="#6CC6CB" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.85" />
  <line x1="16" y1="16" x2="10" y2="21" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.85" />
  <line x1="16" y1="16" x2="21" y2="21" stroke="#22d3ee" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.85" />

  <!-- Peripheral Graph Nodes -->
  <circle cx="22" cy="11" r="2" fill="#EAE5C9" stroke="#0a1014" stroke-width="0.8" />
  <circle cx="10" cy="21" r="1.8" fill="#38bdf8" stroke="#0a1014" stroke-width="0.8" />
  <circle cx="21" cy="21" r="1.8" fill="#10b981" stroke="#0a1014" stroke-width="0.8" />

  <!-- Core Origin Node (Glowing Center) -->
  <circle cx="16" cy="16" r="3.2" fill="url(#cyan-glow)" />
  <circle cx="16" cy="16" r="1.5" fill="#ffffff" />
</svg>
